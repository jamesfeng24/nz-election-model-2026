<!doctype html>
<!-- Source of public/social-card.png (1200 x 630): open in a browser at that size and take a screenshot. -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:'Libre Franklin';font-weight:100 900;src:url('../../public/fonts/libre-franklin-latin-wght-normal.woff2') format('woff2')}
html,body{margin:0;width:1200px;height:630px;background:#f4f3f0;font-family:'Libre Franklin',Arial,sans-serif;overflow:hidden}
.card{position:relative;width:1200px;height:630px}
.tile{position:absolute;left:120px;top:135px;width:360px;height:360px}
.text{position:absolute;left:560px;top:205px;width:560px}
h1{margin:0;font-size:84px;line-height:1.02;font-weight:800;color:#222;letter-spacing:-1px}
p{margin:26px 0 0;font-size:34px;line-height:1.3;color:#5b5b5b}
.rule{width:96px;height:8px;background:#f08a24;margin-top:34px;border-radius:4px}
</style></head><body><div class="card">
<svg class="tile" viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#f08a24"/><rect x="12" y="25" width="10" height="14" rx="3" fill="#fff"/><rect x="27" y="12" width="10" height="27" rx="3" fill="#fff"/><rect x="42" y="19" width="10" height="20" rx="3" fill="#fff"/><text x="32" y="56" text-anchor="middle" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" font-weight="800" fill="#fff">NZ</text></svg>
<div class="text"><h1>NZ Election Forecast</h1><div class="rule"></div><p>Forecast if the election were held today</p></div>
</div></body></html>
