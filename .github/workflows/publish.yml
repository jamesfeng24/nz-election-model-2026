name: Publish
# Builds the next forecast from the newest merged poll refresh and, when told to, publishes it to the public site repository.
#
#   weekly Poll refresh PR -> James merges it (his one manual step) -> this workflow (on that push to main):
#   adopt the newest refresh into the configuration -> development gate -> full production run (65,536 draws; the Python gate must pass)
#   -> TypeScript release gate and append-only archive -> build the live site and a frozen copy of the whole site as it is this week
#   -> independent checks -> push to the public repository (live root + archive/<data cutoff date>/). Any failed gate stops the run before
#   anything is pushed.
#
# Two kinds of publish (docs/publish-workflow.md). A RELEASE happens only when the newest refresh brought new polls, national or electorate (a new data cutoff date):
# it adds one archive entry and one frozen site copy, archive/<date>/, which no later publish touches. With no new polls, a publish is SITE-ONLY:
# the live root is rebuilt from the current site code and the existing archive (a design fix merged to main), with no new forecast, no archive
# entry and no change to any frozen copy; it commits only if the built files differ. A push to main that changes neither the refresh indexes nor
# the site code does not start this workflow.
#
# Two things must both be true before this pushes anywhere (docs/publish-workflow.md):
#   * manual run: the "publish" box is ticked; run on a push to main: the repository variable PUBLISH_AUTO is exactly 'true'
#     (James sets it after he has approved the first publish). A manual run that is not publishing is a DRY RUN: it builds and checks a
#     release rehearsal, never contacts the public repository, never uses the token, and writes nothing outside the runner. A push to main
#     without PUBLISH_AUTO builds nothing.
#   * the run is on main.
# The bookkeeping pull request that follows a publish (about 15 more minutes, then a Verify run on the pull request) is off unless the repository
# variable ADOPTION_PR is exactly 'true'; it is not needed for any later publish. Leaving it off keeps the weekly run lean.
# Only the "Check the public repository", "Push the adoption branch", "Push to the public repository" and "Open the adoption pull request" steps
# receive the token (secret POLL_REFRESH_TOKEN, James's); each runs only in publish mode. Public commits are authored and committed by James
# with a plain message and no trailers (scripts/publish_workflow/public.py). Nothing is force-pushed.
#
# Public logs: this repository is public, so run logs and artifacts are public. Logs print ids, dates and pass/fail only, never forecast numbers.
# A dry run uploads the built site as an artifact only when "preview" is ticked; the artifact is then downloadable by anyone with a GitHub account.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push the forecast and site to the public repository. Leave unticked for a dry run (everything is built and checked; nothing is pushed).'
        required: false
        type: boolean
        default: false
      supersedes:
        description: 'Id of an archived forecast this run corrects, for example nowcast-2026-10-12. It must be a release of the newest data cutoff; its frozen site folder is rebuilt. Empty publishes the next forecast, or only the live site when there are no new polls.'
        required: false
        type: string
      preview:
        description: 'Dry runs only: keep the built site as a downloadable artifact (public, because this repository is public).'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      # a poll refresh (a new forecast when it brought new national or electorate polls)
      - data/processed/polling/weekly-refresh/index.json
      - data/processed/polling/electorate-live/index.json
      # the site code (a site-only republish of the live root)
      - src/**
      - '!src/**/*.test.ts'
      - '!src/**/*.test.tsx'
      - '!src/release/**'
      - public/**
      - index.html
      - '*/index.html'
      - vite.config.ts
      - package.json
      - package-lock.json
      - tsconfig.json
      - data/processed/site-map/**
concurrency:
  group: publish
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Decide the run mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          AUTO: ${{ vars.PUBLISH_AUTO }}
          REF: ${{ github.ref }}
        run: python3 -m scripts.publish_workflow.plan mode --event "$EVENT" --publish-input "$PUBLISH_INPUT" --auto-variable "$AUTO" --ref "$REF"
      - name: Check the site code is on this ref
        run: python3 -m scripts.publish_workflow.plan check-site
      - name: Check the public repository and read its archive
        if: steps.mode.outputs.mode == 'publish'
        env:
          PUBLISH_TOKEN: ${{ secrets.POLL_REFRESH_TOKEN }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then echo "::error::The POLL_REFRESH_TOKEN secret is not set."; exit 1; fi
          python3 -m scripts.publish_workflow.public preflight --clone "$RUNNER_TEMP/public" --archive-to "$RUNNER_TEMP/previous-forecasts" --head-file "$RUNNER_TEMP/public-head"
      - name: Decide what to build (a release, the live site only, or nothing)
        id: release
        env:
          SUPERSEDES: ${{ inputs.supersedes }}
          MODE: ${{ steps.mode.outputs.mode }}
          EVENT: ${{ github.event_name }}
        run: |
          args=()
          if [ -f "$RUNNER_TEMP/previous-forecasts/index.json" ]; then args+=(--existing-ids-from "$RUNNER_TEMP/previous-forecasts/index.json"); fi
          python3 -m scripts.publish_workflow.plan release --mode "$MODE" --event "$EVENT" "${args[@]}" --supersedes "$SUPERSEDES"
      - uses: actions/setup-python@v6
        if: steps.release.outputs.work == 'release'
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v5
        if: steps.release.outputs.work != 'none'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install the pinned Python environment
        if: steps.release.outputs.work == 'release'
        run: python3 -m pip install -r requirements-boundaries.txt
      - name: Install the pinned Node environment
        if: steps.release.outputs.work != 'none'
        run: npm ci
      - name: Switch the configuration to the newest refresh
        id: adopt
        if: steps.release.outputs.work == 'release'
        env:
          NATIONAL: ${{ steps.release.outputs.national_date }}
          SNAPSHOT: ${{ steps.release.outputs.snapshot_id }}
          RELEASE_DATE: ${{ steps.release.outputs.release_date }}
        run: |
          python3 -m scripts.polling.weekly_refresh.adopt --date "$NATIONAL"
          python3 -m scripts.nowcast_config.validate --require-complete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/nowcast-2026.json
          git diff --cached --quiet || git commit -q -m "Polls: adopt the $NATIONAL refresh for $SNAPSHOT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "config_version=$(jq -r .configVersion config/nowcast-2026.json)" >> "$GITHUB_OUTPUT"
          echo "electorate_date=$(jq -r '.seatPolls.electorateRun.date // empty' config/nowcast-2026.json)" >> "$GITHUB_OUTPUT"
          python3 -m scripts.publish_workflow.plan cutoff --expect "$RELEASE_DATE"
      - name: Development gate on the adopted configuration
        if: steps.release.outputs.work == 'release'
        run: |
          python3 -m scripts.nowcast_assembly.run
          python3 -m scripts.publish_workflow.plan gate-passed
      - name: Build the site evidence and check the incumbents
        id: inputs
        if: steps.release.outputs.work == 'release'
        env:
          NATIONAL: ${{ steps.release.outputs.national_date }}
        run: |
          python3 -m scripts.site_evidence.build --refresh "data/processed/polling/weekly-refresh/$NATIONAL"
          python3 -m scripts.site_incumbents.build --check
          evidence="data/processed/site-evidence/$NATIONAL/evidence.json"
          incumbents=$(ls data/processed/site-incumbents/*/incumbents.json | sort | tail -n 1)
          test -f "$evidence"; test -f "$incumbents"
          echo "evidence=$evidence" >> "$GITHUB_OUTPUT"
          echo "incumbents=$incumbents" >> "$GITHUB_OUTPUT"
      - name: Production run (65,536 draws, Python publication gate)
        if: steps.release.outputs.work == 'release'
        run: |
          mkdir -p .release-build/production
          python3 -m scripts.nowcast_assembly.run --require-complete --bank .release-build/production/bank.json --workers 4
      - name: Release gate and archive
        if: steps.release.outputs.work == 'release'
        env:
          SNAPSHOT: ${{ steps.release.outputs.snapshot_id }}
          SUPERSEDES: ${{ steps.release.outputs.supersedes }}
          NATIONAL: ${{ steps.release.outputs.national_date }}
          REVISION: ${{ steps.adopt.outputs.revision }}
          CUTOFF: ${{ steps.adopt.outputs.cutoff }}
          EVIDENCE: ${{ steps.inputs.outputs.evidence }}
          INCUMBENTS: ${{ steps.inputs.outputs.incumbents }}
        run: |
          python3 -m scripts.publish_workflow.plan options --out .release-build/production/options.json --snapshot-id "$SNAPSHOT" --code-revision "$REVISION" --national-date "$NATIONAL"
          mkdir -p public/forecasts
          if [ -d "$RUNNER_TEMP/previous-forecasts" ]; then cp -a "$RUNNER_TEMP/previous-forecasts/." public/forecasts/; fi
          npm run release:build
          args=()
          if [ -n "$SUPERSEDES" ]; then args+=(--supersedes "$SUPERSEDES"); fi
          npm run release:publish -- --bank .release-build/production/bank.json --options .release-build/production/options.json --archive public/forecasts --evidence "$EVIDENCE" --incumbents "$INCUMBENTS" "${args[@]}"
          prev=()
          if [ -d "$RUNNER_TEMP/previous-forecasts" ]; then prev+=(--previous "$RUNNER_TEMP/previous-forecasts"); fi
          python3 -m scripts.publish_workflow.verify archive --new public/forecasts "${prev[@]}" --snapshot-id "$SNAPSHOT" --cutoff "$CUTOFF" --supersedes "$SUPERSEDES"
      - name: Put the published archive in place (site-only)
        if: steps.release.outputs.work == 'site'
        run: |
          mkdir -p public/forecasts
          cp -a "$RUNNER_TEMP/previous-forecasts/." public/forecasts/
          python3 -m scripts.publish_workflow.verify archive --new public/forecasts --previous "$RUNNER_TEMP/previous-forecasts" --no-new
      - name: Build the site and check the tree
        if: steps.release.outputs.work != 'none'
        run: |
          npm run build
          npm run check:dist
          python3 -m scripts.publish_workflow.verify tree --site site
      - name: Build the frozen copy of the site for this week (release)
        if: steps.release.outputs.work == 'release'
        env:
          CUTOFF: ${{ steps.adopt.outputs.cutoff }}
        run: |
          SITE_ARCHIVE_DATE="$CUTOFF" SITE_OUT_DIR=site-archived npm run build
          node scripts/validate/no_synthetic_in_dist.mjs site-archived
          node scripts/validate/check_site.mjs site-archived
          python3 -m scripts.publish_workflow.verify tree --site site-archived
      - name: Dry run summary
        if: steps.release.outputs.work == 'release' && steps.mode.outputs.mode != 'publish'
        env:
          SNAPSHOT: ${{ steps.release.outputs.snapshot_id }}
          CUTOFF: ${{ steps.adopt.outputs.cutoff }}
          CONFIG_VERSION: ${{ steps.adopt.outputs.config_version }}
        run: |
          {
            echo "### Dry run: nothing was pushed"
            echo
            echo "The forecast \`$SNAPSHOT\` (data to $CUTOFF, configuration $CONFIG_VERSION) was built, passed the Python publication gate, the release gate and the archive and site checks, and its frozen site copy for archive/$CUTOFF/ was built and checked."
            echo "The public repository was not contacted and no token was used. To publish, run this workflow again from main with the publish box ticked."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.work == 'release' && steps.mode.outputs.mode != 'publish' && inputs.preview
        with:
          name: site-preview
          path: |
            site
            site-archived
          retention-days: 3
      - name: Push the adoption branch
        id: branch
        if: steps.release.outputs.work == 'release' && steps.mode.outputs.mode == 'publish'
        env:
          PUBLISH_TOKEN: ${{ secrets.POLL_REFRESH_TOKEN }}
          SNAPSHOT: ${{ steps.release.outputs.snapshot_id }}
        run: |
          branch="publish/$SNAPSHOT-run$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 -m scripts.publish_workflow.public push-branch --branch "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
      - name: Push to the public repository
        id: push
        if: steps.release.outputs.work != 'none' && steps.mode.outputs.mode == 'publish'
        env:
          PUBLISH_TOKEN: ${{ secrets.POLL_REFRESH_TOKEN }}
          WORK: ${{ steps.release.outputs.work }}
          CUTOFF: ${{ steps.adopt.outputs.cutoff }}
          SUPERSEDES: ${{ steps.release.outputs.supersedes }}
        run: |
          args=(--clone "$RUNNER_TEMP/public" --site site --expected-head "$(cat "$RUNNER_TEMP/public-head")")
          if [ "$WORK" = release ]; then
            args+=(--message "Update forecast $CUTOFF" --frozen site-archived --frozen-name "$CUTOFF")
            if [ -n "$SUPERSEDES" ]; then args+=(--correction); fi
          else
            args+=(--message "Update site $(date -u +%F)")
          fi
          python3 -m scripts.publish_workflow.public push "${args[@]}"
      - name: Open the adoption pull request
        if: steps.release.outputs.work == 'release' && steps.mode.outputs.mode == 'publish' && steps.push.conclusion == 'success' && vars.ADOPTION_PR == 'true'
        continue-on-error: true
        env:
          PUBLISH_TOKEN: ${{ secrets.POLL_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.POLL_REFRESH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SNAPSHOT: ${{ steps.release.outputs.snapshot_id }}
          RELEASE_DATE: ${{ steps.release.outputs.release_date }}
          NATIONAL: ${{ steps.release.outputs.national_date }}
          ELECTORATE: ${{ steps.adopt.outputs.electorate_date }}
          REVISION: ${{ steps.adopt.outputs.revision }}
          CONFIG_VERSION: ${{ steps.adopt.outputs.config_version }}
          BRANCH: ${{ steps.branch.outputs.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Bookkeeping only: the forecast is already public. Regenerate what follows the configuration so main can carry the same adoption.
          python3 -m scripts.nowcast_assembly.fixture
          python3 -m scripts.seat_polls.readout
          python3 -m scripts.nowcast_assembly.run --check
          python3 -m scripts.nowcast_assembly.fixture --check
          python3 -m scripts.seat_polls.readout --check
          fragment="handoff.d/$RELEASE_DATE-publish-$SNAPSHOT.md"
          python3 -m scripts.publish_workflow.plan adoption --snapshot-id "$SNAPSHOT" --release-date "$RELEASE_DATE" --national-date "$NATIONAL" --electorate-date "$ELECTORATE" \
            --config-version "$CONFIG_VERSION" --revision "$REVISION" --run-url "$RUN_URL" --fragment-out "$fragment" --title-out "$RUNNER_TEMP/pr-title.txt" --body-out "$RUNNER_TEMP/pr-body.md"
          python3 -m scripts.fold_doc_fragments --check
          git add "$fragment" data/processed/nowcast-assembly/development-gate.json data/fixtures/synthetic/nowcast-draw-bank.json data/processed/seat-polls/readout-2026.json
          unexpected=$(git status --porcelain --untracked-files=no | grep -v -E '^(M|A|MM|AM) ' || true)
          if [ -n "$unexpected" ]; then echo "::error::Unexpected changes: $unexpected"; exit 1; fi
          git commit -q -m "Polls: regenerate the development gate, fixture and readout for $SNAPSHOT"
          python3 -m scripts.publish_workflow.public push-branch --branch "$BRANCH"
          url=$(gh pr create --base main --head "$BRANCH" --title "$(cat "$RUNNER_TEMP/pr-title.txt")" --body-file "$RUNNER_TEMP/pr-body.md")
          gh pr edit "$url" --add-assignee "${{ github.repository_owner }}" || true
          gh label create publish-adoption --color 0e8a16 --description "Bookkeeping after a publish" >/dev/null 2>&1 || true
          gh pr edit "$url" --add-label publish-adoption || true
          echo "Opened $url"
