name: Full replay
# Manual, complete validation of main (or any ref) with the frozen pipelines replayed in parallel jobs, so each job
# fits well inside its limit. It runs every command of the Verify `python` job with no reuse; the command list is
# read from ci.yml by scripts/validate/ci_full_replay.py, so the two cannot drift (a unit test checks the partition
# and this file's group list). It does not replace Verify on pull requests and main pushes and is not read by the
# frozen-pipeline selector.
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check production build excludes synthetic fixtures (when defined)
        run: |
          if node -e "process.exit(require('./package.json').scripts['check:dist'] ? 0 : 1)"; then
            npm run check:dist
          else
            echo "check:dist is not defined yet; skipped"
          fi
  python:
    name: python (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: base
            timeout: 150
          - group: stage39
            timeout: 45
          - group: stage45-47
            timeout: 270
          - group: stage48
            timeout: 120
          - group: stage54
            timeout: 180
          - group: stage63
            timeout: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python3 -m pip install -r requirements-boundaries.txt
      - run: python3 -m scripts.validate.ci_full_replay --check
      - run: python3 -m scripts.validate.ci_full_replay --group ${{ matrix.group }}
  full:
    name: Full replay passed
    needs: [check, python]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job
        env:
          RESULTS: ${{ needs.check.result }} ${{ needs.python.result }}
        run: |
          echo "check/python results: $RESULTS"
          [ "$RESULTS" = "success success" ]
