name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python3 -m pip install -r requirements-boundaries.txt
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: python3 scripts/validate/source_files.py
      - run: python3 -m scripts.transform.historical_panel --check --verify-years
      - run: python3 -m scripts.transform.modern_election --check
      - run: python3 -m scripts.transform.modern_election --year 2020 --check
