name: Verify
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check production build excludes synthetic fixtures (when defined)
        run: |
          if node -e "process.exit(require('./package.json').scripts['check:dist'] ? 0 : 1)"; then
            npm run check:dist
          else
            echo "check:dist is not defined yet; skipped"
          fi
  live:
    # The live 2026 chain (Stage50 to Stage83): each stage's own --check, run beside the long `python` job so wall time does
    # not grow. Not here: the development gate, the synthetic bank fixture and the Stage79 2026 readout, which read the newest
    # weekly electorate-poll run and so change with every refresh until the config pins that run.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python3 -m pip install -r requirements-boundaries.txt
      - run: python3 -m scripts.nowcast_config.validate --require-complete
      - run: python3 -m scripts.nowcast_config.scales --check
      - run: python3 -m scripts.polling.weekly_refresh.run --check
      - run: python3 -m scripts.polling.weekly_refresh.electorate_polls --check
      - run: python3 -m scripts.polling.electorate_refresh.run --check
      - run: python3 -m scripts.nominations_2026.refresh --acquisition data/processed/nominations-2026/2026-10-10/acquisition.json --check
      - run: python3 -m scripts.voting_place_notionals.run --check
      - run: python3 -m scripts.electorate_baseline.build --check
      - run: python3 -m scripts.exceptional_scale.run --check
      - run: python3 -m scripts.maori_seat_layer.run --check
      - run: python3 -m scripts.maori_seat_layer.results --check
      - run: python3 -m scripts.maori_seat_calibration.run --check
      - run: python3 -m scripts.maori_seat_fallback.run --check
      - run: python3 -m scripts.shared_split_swing.run --check
      - run: python3 -m scripts.party_vote_elasticity.run --check
      - run: python3 -m scripts.party_vote_elasticity.run --stage findings --check
      - run: python3 -m scripts.seat_polls.run --check
      - run: python3 -m scripts.exceptional_balance_scale.inputs --check
      - run: python3 -m scripts.exceptional_balance_scale.fit --check
      - run: python3 -m scripts.exceptional_balance_scale.decision --check
      - run: python3 -m scripts.ordinary_minor_spread.inputs --check
      - run: python3 -m scripts.ordinary_minor_spread.fit --check
      - run: python3 -m scripts.ordinary_minor_spread.decision --check
      - run: python3 -m scripts.manual_adjustment.run build-template --check
      - run: python3 -m scripts.candidate_fit_2026.run --check
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python3 -m pip install -r requirements-boundaries.txt
      - name: Select bounded Stage39 validation
        id: stage39
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: python3 -m scripts.validate.ci_selection --event "$CI_EVENT_NAME" --github-output "$GITHUB_OUTPUT"
      - name: Select frozen-pipeline reuse
        id: frozen
        continue-on-error: true
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m scripts.validate.ci_frozen --event "$CI_EVENT_NAME" --github-output "$GITHUB_OUTPUT" --result-file "$RUNNER_TEMP/frozen-selection.json"
      - run: python3 -m scripts.polling.external_comparison.archive --check
      - run: python3 -m scripts.polling.external_comparison.evaluation --check
      - run: python3 -m scripts.polling.category_interface.run --check
      - run: python3 -m scripts.polling.national_model.evaluation --check
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: python3 scripts/validate/source_files.py
      - run: python3 -m scripts.transform.historical_panel --check --verify-years
      - run: python3 -m scripts.transform.modern_election --check
      - run: python3 -m scripts.transform.modern_election --year 2020 --check
      - run: python3 -m scripts.models.complete_party_vector.inventory --check
      - run: python3 -m scripts.models.complete_party_vector.construction --check
      - run: python3 -m scripts.models.complete_party_vector.evaluation --check
      - run: python3 -m scripts.checkpoints.stage24_inventory --check
      - run: python3 -m scripts.checkpoints.stage24_construction --check
      - run: python3 -m scripts.checkpoints.stage24_evaluation --check
      - run: python3 -m scripts.checkpoints.stage25_geography --check
      - run: python3 -m scripts.checkpoints.stage25_availability --check
      - run: python3 -m scripts.checkpoints.stage25_design --check
      - run: python3 -m scripts.evidence.practical_candidate_linkage.run --check
      - run: python3 -m scripts.models.exact_geography_retests.inventory --check
      - run: python3 -m scripts.models.exact_geography_retests.construction --check
      - run: python3 -m scripts.models.exact_geography_retests.evaluation --check
      - run: python3 -m scripts.validate.stage27_independent --check
      - run: python3 -m scripts.checkpoints.stage28_design --check
      - run: python3 -m scripts.models.asymmetric_response_test.construction --check
      - run: python3 -m scripts.models.asymmetric_response_test.evaluation --check
      - run: python3 -m scripts.models.asymmetric_response_test.verification --check
      - run: python3 -m scripts.models.asymmetric_response_test.descriptive_diagnostic --check
      - run: python3 -m scripts.models.asymmetric_response_test.supplement_evaluation --check
      - run: python3 -m scripts.models.expanded_candidate_persistence.inventory --check
      - run: python3 -m scripts.models.expanded_candidate_persistence.construction --check
      - run: python3 -m scripts.models.expanded_candidate_persistence.evaluation --check
      - run: python3 -m scripts.models.expanded_candidate_persistence.verification --check
      - run: python3 -m scripts.models.expanded_candidate_persistence.report --check
      - run: python3 -m scripts.models.expanded_party_substitution.inventory --check
      - run: python3 -m scripts.models.expanded_party_substitution.construction --check
      - run: python3 -m scripts.models.expanded_party_substitution.evaluation --check
      - run: python3 -m scripts.models.expanded_party_substitution.verification --check
      - run: python3 -m scripts.models.expanded_party_substitution.report --check
      - run: python3 -m scripts.checkpoints.joint_candidate_share.run --check
      - run: python3 -m scripts.checkpoints.joint_candidate_share.report --check
      - run: python3 -m scripts.models.joint_candidate_share.construction --check
      - run: python3 -m scripts.models.joint_candidate_share.evaluation --check
      - run: python3 -m scripts.models.joint_candidate_share.verification --check
      - run: python3 -m scripts.models.joint_candidate_share.report --check
      - run: python3 -m scripts.diagnostics.s_r_robustness.inventory --check
      - run: python3 -m scripts.diagnostics.s_r_robustness.movement --check
      - run: python3 -m scripts.diagnostics.s_r_robustness.analysis --check
      - run: python3 -m scripts.diagnostics.s_r_robustness.verification --check
      - run: python3 -m scripts.diagnostics.s_r_robustness.report --check
      - run: python3 -m scripts.polling.national_foundation.run --check
      - run: python3 -m scripts.polling.national_foundation.design --check
      - run: python3 -m scripts.polling.national_foundation.verification --check
      - run: python3 -m scripts.polling.national_model.inventory --check
      - run: python3 -m scripts.polling.national_model.archive --check
      - run: python3 -m scripts.polling.national_model.verification --check
      - run: python3 -m scripts.polling.national_model.report --check
      - run: python3 -m scripts.polling.national_model.outputs --check
      - run: python3 -m scripts.polling.category_interface.verification --check
      - run: python3 -m scripts.polling.category_interface.report --check
      - run: python3 -m scripts.polling.category_interface.handoff --check
      - run: python3 -m scripts.polling.external_comparison.numerical_audit --check
      - run: python3 -m scripts.polling.external_comparison.verification --check
      - run: python3 -m scripts.polling.external_comparison.report --check
      - name: Verify previously validated Stage39 sealed integrity
        if: steps.stage39.outputs.mode == 'integrity'
        run: python3 -m scripts.validate.ci_stage39 --check
      - run: python3 -m scripts.polling.candidate_integration.inventory --check
        if: steps.stage39.outputs.mode != 'integrity'
      - run: python3 -m scripts.polling.candidate_integration.construction --check
        if: steps.stage39.outputs.mode != 'integrity'
      - run: python3 -m scripts.polling.candidate_integration.evaluation --check
        if: steps.stage39.outputs.mode != 'integrity'
      - run: python3 -m scripts.polling.candidate_integration.verification --check
        if: steps.stage39.outputs.mode != 'integrity'
      - run: python3 -m scripts.polling.candidate_integration.report --check
        if: steps.stage39.outputs.mode != 'integrity'
      - run: python3 -m scripts.readiness.run --check
      - run: python3 -m scripts.readiness.report --check
      - run: python3 -m scripts.readiness.verification --check
      - run: python3 -m scripts.transport.freeze --check
      - run: python3 -m scripts.transport.party --check
      - run: python3 -m scripts.transport.construction --check
      - run: python3 -m scripts.transport.evaluation --check
      - run: python3 -m scripts.transport.readiness --check
      - run: python3 -m scripts.transport.verification --check
      - run: python3 -m scripts.transport.report --check
      - run: python3 -m scripts.transport.manifest --check
      - run: python3 -m scripts.transport.continuous.freeze --check
      - run: python3 -m scripts.transport.continuous.construction --check
      - run: python3 -m scripts.transport.continuous.evaluation --check
      - run: python3 -m scripts.transport.continuous.readiness --check
      - run: python3 -m scripts.transport.continuous.verification --check
      - run: python3 -m scripts.transport.continuous.report --check
      - run: python3 -m scripts.transport.continuous.manifest --check
      - run: python3 -m scripts.transport.comparison.construction --check
      - run: python3 -m scripts.transport.comparison.evaluation --check
      - run: python3 -m scripts.transport.comparison.verification --check
      - run: python3 -m scripts.transport.comparison.report --check
      - run: python3 -m scripts.transport.comparison.manifest --check
      - run: python3 -m scripts.uncertainty.inventory --check
      - run: python3 -m scripts.uncertainty.estimation --check
      - run: python3 -m scripts.uncertainty.construction --check
      - run: python3 -m scripts.uncertainty.evaluation --check
      - run: python3 -m scripts.uncertainty.precision --check
      - run: python3 -m scripts.uncertainty.verification --check
      - run: python3 -m scripts.uncertainty.report --check
      - run: python3 -m scripts.uncertainty.manifest --check
      - run: python3 -m scripts.uncertainty_revision.diagnosis --check
      - run: python3 -m scripts.uncertainty_revision.priors --check
      - run: python3 -m scripts.uncertainty_revision.estimation --check
      - run: python3 -m scripts.uncertainty_revision.construction --check
        if: steps.frozen.outputs.stage45 != 'integrity'
      - run: python3 -m scripts.uncertainty_revision.evaluation --check
        if: steps.frozen.outputs.stage45 != 'integrity'
      - run: python3 -m scripts.uncertainty_revision.mean_audit --check
        if: steps.frozen.outputs.stage45 != 'integrity'
      - run: python3 -m scripts.uncertainty_revision.verification --check
        if: steps.frozen.outputs.stage45 != 'integrity'
      - name: Verify reused Stage45 frozen pipeline
        if: steps.frozen.outputs.stage45 == 'integrity'
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
        run: python3 -m scripts.validate.ci_frozen --check --pipeline stage45 --event "$CI_EVENT_NAME" --result-file "$RUNNER_TEMP/frozen-selection.json"
      - run: python3 -m scripts.uncertainty_revision.report --check
      - run: python3 -m scripts.uncertainty_revision.manifest --check
      - run: python3 -m scripts.uncertainty_tails.diagnosis --check
      - run: python3 -m scripts.uncertainty_tails.estimation --check
      - run: python3 -m scripts.uncertainty_tails.numerics --check
      - run: python3 -m scripts.uncertainty_tails.construction --check
        if: steps.frozen.outputs.stage46 != 'integrity'
      - run: python3 -m scripts.uncertainty_tails.evaluation --check
        if: steps.frozen.outputs.stage46 != 'integrity'
      - run: python3 -m scripts.uncertainty_tails.verification --check
        if: steps.frozen.outputs.stage46 != 'integrity'
      - name: Verify reused Stage46 frozen pipeline
        if: steps.frozen.outputs.stage46 == 'integrity'
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
        run: python3 -m scripts.validate.ci_frozen --check --pipeline stage46 --event "$CI_EVENT_NAME" --result-file "$RUNNER_TEMP/frozen-selection.json"
      - run: python3 -m scripts.diagnostics.uncertainty_tails_reference --check
      - run: python3 -m scripts.diagnostics.uncertainty_tails_report --check
      - run: python3 -m scripts.diagnostics.uncertainty_tails_manifest --check
      - run: python3 -m scripts.uncertainty_expectation.pilot --check
      - run: python3 -m scripts.uncertainty_expectation.prior --check
      - run: python3 -m scripts.uncertainty_expectation.audits --check
        if: steps.frozen.outputs.stage47 != 'integrity'
      - run: python3 -m scripts.uncertainty_expectation.structure --check
      - run: python3 -m scripts.uncertainty_expectation.structural_diagnostics --check
      - run: python3 -m scripts.uncertainty_expectation.construction --check
        if: steps.frozen.outputs.stage47 != 'integrity'
      - run: python3 -m scripts.uncertainty_expectation.evaluation --check
        if: steps.frozen.outputs.stage47 != 'integrity'
      - run: python3 -m scripts.uncertainty_expectation.pair_widths --check
      - run: python3 -m scripts.uncertainty_expectation.attribution --check
        if: steps.frozen.outputs.stage47 != 'integrity'
      - run: python3 -m scripts.uncertainty_expectation.verification --check
        if: steps.frozen.outputs.stage47 != 'integrity'
      - name: Verify reused Stage47 frozen pipeline
        if: steps.frozen.outputs.stage47 == 'integrity'
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
        run: python3 -m scripts.validate.ci_frozen --check --pipeline stage47 --event "$CI_EVENT_NAME" --result-file "$RUNNER_TEMP/frozen-selection.json"
      - run: python3 -m scripts.uncertainty_expectation.report --check
      - run: python3 -m scripts.uncertainty_expectation.manifest --check
      - run: python3 -m scripts.balance_scale.fit --check
      - run: python3 -m scripts.balance_scale.evaluation --check
        if: steps.frozen.outputs.stage48 != 'integrity'
      - run: python3 -m scripts.balance_scale.decision --check
      - run: python3 -m scripts.balance_scale.verification --check
        if: steps.frozen.outputs.stage48 != 'integrity'
      - name: Verify reused Stage48 frozen pipeline
        if: steps.frozen.outputs.stage48 == 'integrity'
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
        run: python3 -m scripts.validate.ci_frozen --check --pipeline stage48 --event "$CI_EVENT_NAME" --result-file "$RUNNER_TEMP/frozen-selection.json"
      - run: python3 -m scripts.balance_scale.report --check
      - run: python3 -m scripts.balance_scale.manifest --check
      - run: python3 -m scripts.composed_precision.evaluation --check
        if: steps.frozen.outputs.stage54 != 'integrity'
      - run: python3 -m scripts.composed_precision.decision --check
      - run: python3 -m scripts.composed_precision.verification --check
        if: steps.frozen.outputs.stage54 != 'integrity'
      - name: Verify reused Stage54 frozen pipeline
        if: steps.frozen.outputs.stage54 == 'integrity'
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
        run: python3 -m scripts.validate.ci_frozen --check --pipeline stage54 --event "$CI_EVENT_NAME" --result-file "$RUNNER_TEMP/frozen-selection.json"
      - run: python3 -m scripts.composed_precision.report --check
      - run: python3 -m scripts.composed_precision.manifest --check
      - run: python3 -m scripts.layer_replication.evaluation --check
        if: steps.frozen.outputs.stage63 != 'integrity'
      - run: python3 -m scripts.layer_replication.decision --check
      - run: python3 -m scripts.layer_replication.verification --check
        if: steps.frozen.outputs.stage63 != 'integrity'
      - name: Verify reused Stage63 frozen pipeline
        if: steps.frozen.outputs.stage63 == 'integrity'
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
        run: python3 -m scripts.validate.ci_frozen --check --pipeline stage63 --event "$CI_EVENT_NAME" --result-file "$RUNNER_TEMP/frozen-selection.json"
      - run: python3 -m scripts.layer_replication.report --check
      - run: python3 -m scripts.layer_replication.manifest --check
